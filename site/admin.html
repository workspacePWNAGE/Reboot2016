<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Terminal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 14px;
            height: 100%;
            overflow: hidden;
        }
        #terminal-container {
            padding: 10px 15px;
            height: calc(100% - 20px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #output {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }
        #input-line {
            display: flex;
            align-items: center;
            margin-top: 2px;
        }
        #prompt-symbol {
            margin-right: 8px;
        }
        #cli {
            background: transparent;
            border: none;
            color: #d4d4d4;
            outline: none;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 14px;
            flex-grow: 1;
            caret-color: #d4d4d4;
        }
        .error { color: #f44747; }
        .success { color: #4CAF50; }
        .system { color: #808080; }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt-symbol">admin@server:~$</span>
            <input type="text" id="cli" autocomplete="off" autofocus>
        </div>
    </div>

    <input type="file" id="hidden-file-input" style="display: none;">

    <script src="/admin/terminal.js"></script>
</body>
</html>
